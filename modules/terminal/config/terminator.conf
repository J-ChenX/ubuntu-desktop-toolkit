[global_config]
  handle_size = 3
  broadcast_default = off
  title_transmit_fg_color = "#cdd6f4"
  title_transmit_bg_color = "#313244"
  title_receive_fg_color = "#cdd6f4"
  title_receive_bg_color = "#45475a"
  title_inactive_fg_color = "#a6adc8"
  title_inactive_bg_color = "#181825"
  enabled_plugins = LaunchpadBugURLHandler, LaunchpadCodeURLHandler, APTURLHandler, CustomCommandsMenu
  clear_select_on_copy = True
[keybindings]
  copy = <Control>c
  paste = <Control>v
[profiles]
  [[default]]
    background_color = "#1e1e2e"
    cursor_color = "#f5e0dc"
    foreground_color = "#cdd6f4"
    show_titlebar = False
    scrollback_lines = 10000
    palette = "#45475a:#f38ba8:#a6e3a1:#f9e2af:#89b4fa:#f5c2e7:#94e2d5:#bac2de:#585b70:#f38ba8:#a6e3a1:#f9e2af:#89b4fa:#f5c2e7:#94e2d5:#a6adc8"
    use_system_font = False
    font = Maple Mono NF CN 11
[layouts]
  [[default]]
    [[[window0]]]
      type = Window
      parent = ""
    [[[child1]]]
      type = Terminal
      parent = window0
      profile = default
[plugins]
